<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Docs API</title>
</head>
<body>
  <h1>Mini Docs API</h1>

  <button id="loadDocsBtn">Загрузить документы</button>
  
<h2>Поиск документов</h2>
  <input type = "text" id="searchInput" placeholder="Поиск по title и description">
  <button id="searchBtn">Найти</button>
  <button id="resetBtn">Сбросить поиск</button>


  <h2>Создать документ</h2>
  <input type="text" id="titleInput" placeholder="Название документа">
  <input type="text" id="dateInput" placeholder="Дата создания">
  <input type="text" id="descriptionInput" placeholder="Описание документа">
  <button id="createDocBtn">Создать</button>
  
  <p id ="message"></p>

  <h2>Список документов</h2>
  <ul id="docsList"></ul>

  <script>
    const loadDocsBtn = document.getElementById("loadDocsBtn");
    const createDocBtn = document.getElementById("createDocBtn");
    const titleInput = document.getElementById("titleInput");
    const dateInput = document.getElementById("dateInput");
    const docsList = document.getElementById("docsList");
    const searchInput = document.getElementById("searchInput");
    const searchBtn = document.getElementById("searchBtn");
    const resetBtn = document.getElementById("resetBtn");
    const descriptionInput = document.getElementById("descriptionInput")
    const message = document.getElementById("message");

    const API_URL = "http://127.0.0.1:4000/docs";

    function showMessage(text) {
      message.textContent = text;
      setTimeout(() => {
        message.textContent = "";
      }, 1500);
    }

    function renderDocs(docs) {
      docsList.innerHTML = "";

    if (docs.length === 0) {
        showMessage("Документов нет");
        return;
      } 

      docs.forEach((doc) => {
        const li = document.createElement("li");
        li.style.marginBottom = "8px";

        const text = document.createElement("span");
        text.textContent = `ID: ${doc.id} | ${doc.title} | ${doc.createdAt} | ${doc.description}`;

        const editBtn = document.createElement("button");
        editBtn.textContent = "Изменить";
        editBtn.style.marginLeft = "8px";
        editBtn.addEventListener("click", function () {
          editDoc(doc);
        });

        const deleteBtn = document.createElement("button");
        deleteBtn.textContent = "Удалить";
        deleteBtn.style.marginLeft = "5px";
        deleteBtn.addEventListener("click", function () {
          deleteDoc(doc.id);
        });

        li.appendChild(text);
        li.appendChild(editBtn);
        li.appendChild(deleteBtn);

        docsList.appendChild(li);
      });
    }

    async function loadDocs() {
      try {
        const response = await fetch(API_URL);
        const docs = await response.json();
        renderDocs(docs);
      } catch (error) {
        console.log("Ошибка загрузки документов", error);
      }
    }

    async function searchDocs() { 
      const searchValue = searchInput.value.trim();
      try {
        let url = API_URL;
        if(searchValue) {
          url = `${API_URL}?search=${encodeURIComponent(searchValue)}`;
        }
        const response = await fetch(url);
        const docs = await response.json();
        renderDocs(docs);
      } catch (error) {
        console.log("Ошибка поиска документов", error);
        showMessage("Ошибка поиска документов");
      }
    }

    function resetSearch() {
      searchInput.value = "";
      loadDocs();
    }

    function clearDocs() {
      docsList.innerHTML = "";
      showMessage("Список очищен");
    }
    async function createDoc() {
      const title = titleInput.value.trim();
      const createdAt = dateInput.value.trim();
      const description = descriptionInput.value.trim();

      if (!title) {
        alert("Введите название документа");
        return;
      }

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            title: title,
            createdAt: createdAt,
            description: description
          })
        });

        const newDoc = await response.json();
        console.log("Создан документ:", newDoc);
        showMessage("Документ создан");

        loadDocs();

        titleInput.value = "";
        dateInput.value = "";
        descriptionInput.value ="";
      } catch (error) {
        console.log("Ошибка создания документа", error);
      }
    }

    async function deleteDoc(id) {
      try {
        const response = await fetch(`${API_URL}/${id}`, {
          method: "DELETE"
        });

        const result = await response.json();
        console.log("Удаление:", result);
        showMessage("Документ удален");

        loadDocs();
      } catch (error) {
        console.log("Ошибка удаления документа", error);
      }
    }

    async function editDoc(doc) {
      const newTitle = prompt("Введите новое название документа", doc.title);
      const newDate = prompt("Введите новую дату", doc.createdAt);
      const newDescription = prompt("Введите новое описание документа", doc.description);

      if (!newTitle) {
        return;
      }

      try {
        const response = await fetch(`${API_URL}/${doc.id}`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            title: newTitle,
            createdAt: newDate,
            description: newDescription
          })
        });

        const updatedDoc = await response.json();
        console.log("Документ обновлен:", updatedDoc);
          showMessage("Документ обновлен");
        loadDocs();

      } catch (error) {
        console.log("Ошибка обновления документа", error);
      }
    }

    loadDocsBtn.addEventListener("click", loadDocs);
    createDocBtn.addEventListener("click", createDoc);
    searchBtn.addEventListener("click", searchDocs);
    resetBtn.addEventListener("click", resetSearch);
    
  </script>
</body>
</html>
